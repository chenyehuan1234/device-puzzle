<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>probe</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo"></span>机关谜题<span class="tiny">probe</span><span class="tiny" id="brand-ver"></span></div>
    <div class="tabs">
      <button class="tab is-on" id="tab-play" data-mode="play">▶ 游玩</button>
      <button class="tab" id="tab-edit" data-mode="edit">✎ 关卡编辑器</button>
    </div>
    <div class="grow"></div>
    <label class="chk"><input type="checkbox" id="chk-sfx" checked><span>🔊 音效</span></label>
    <label class="chk"><input type="checkbox" id="chk-preview" checked><span>悬停推演</span></label>
    <label class="chk"><input type="checkbox" id="chk-anim" checked><span>动画</span></label>
    <button class="btn ghost" id="btn-help">规则说明</button>
  </header>

  <main>
    <aside class="side left" id="tree-col" hidden>
      <div class="sec">
        <div class="sec-title">当前关卡</div>
        <input id="edit-name" class="input">
        <div class="row">
          <label class="mini">宽<input id="edit-w" class="num" type="number"></label>
          <label class="mini">高<input id="edit-h" class="num" type="number"></label>
          <button id="btn-resize" class="btn">应用尺寸</button>
        </div>
        <div class="row"><label class="mini" style="flex:1">所属大关<select id="edit-chapter" class="input"></select></label></div>
        <div class="row"><button id="btn-edit-new" class="btn">新建关卡</button><button id="btn-edit-saveas" class="btn">另存为副本</button></div>
        <div class="row"><button id="btn-edit-del" class="btn danger">删除本关</button></div>
      </div>
      <div class="sec">
        <div class="sec-title">关卡信息栏</div>
        <div id="tree" class="tree"></div>
      </div>
      <div class="sec">
        <div class="sec-title">大关管理</div>
        <div class="row"><button id="btn-chapter-add" class="btn">新建大关</button><button id="btn-chapter-rename" class="btn">改名</button></div>
        <div class="row"><button id="btn-chapter-del" class="btn danger">删除选中大关</button></div>
        <div class="row"><button id="btn-progress-reset" class="btn">清空通关记录</button></div>
      </div>
    </aside>

    <section class="board-col">
      <div id="play-select" class="select-screen" hidden>
        <div class="select-inner">
          <div class="select-head"><div class="select-title">选择关卡</div><div class="hint" id="progress-info"></div></div>
          <div id="play-chapters"></div>
          <div class="select-tools"><button class="btn" id="btn-play-sandbox">进入机制沙盒（自检用）</button></div>
        </div>
      </div>

      <div id="stage" class="stage">
        <div class="board-head"><h1 id="level-title">—</h1><div id="board-sub" class="sub"></div></div>
        <div class="board-wrap" id="board-wrap">
          <canvas id="board"></canvas>
          <div class="win-banner" id="win-banner" hidden><div class="win-card">
            <div class="win-title">通 关 ！</div><div class="win-sub" id="win-sub"></div>
            <div class="row center">
              <button class="btn primary" id="btn-win-next">下一关 (Enter)</button>
              <button class="btn" id="btn-win-again">重玩 (R)</button>
              <button class="btn" id="btn-win-select">返回选关</button>
            </div>
          </div></div>
        </div>
        <div class="board-bar" id="edit-bar" hidden>
          <button id="btn-edit-play" class="btn primary">▶ 试玩 <kbd>S</kbd></button>
          <button id="btn-edit-save" class="btn">💾 保存并新建下一关 <kbd>Ctrl+S</kbd></button>
          <button id="btn-edit-undo" class="btn">撤销 <kbd>Ctrl+Z</kbd></button>
          <button id="btn-edit-clear" class="btn">清空物品</button>
          <span class="bar-sep"></span>
          <button id="btn-edit-export" class="btn">导出 JSON</button>
          <button id="btn-edit-import" class="btn">导入 JSON</button>
          <button id="btn-edit-json" class="btn">查看 / 编辑 JSON</button>
          <input type="file" id="file-import" accept=".json,application/json" hidden>
        </div>
        <div class="board-bar" id="play-bar" hidden>
          <button id="btn-play-prev" class="btn">◀ 上一关</button>
          <button id="btn-play-undo" class="btn">撤回 <kbd>空格</kbd></button>
          <button id="btn-play-restart" class="btn">重开 <kbd>R</kbd></button>
          <button id="btn-play-next" class="btn">下一关 ▶</button>
          <span class="bar-sep"></span>
          <button id="btn-play-select" class="btn">选关 <kbd>Esc</kbd></button>
          <button id="btn-play-back" class="btn primary" hidden>返回编辑 <kbd>B</kbd></button>
        </div>
        <div class="board-foot"><span id="hint" class="hint"></span><span class="grow"></span><span id="foot-right" class="hint dim"></span></div>
      </div>
    </section>

    <aside class="side" id="side-col">
      <div class="panel" id="panel-play">
        <div class="sec"><div class="sec-title">状态</div>
          <div class="stat"><span>步数</span><b id="stat-moves">0</b></div>
          <div class="stat"><span>未归位图形</span><b id="stat-misplaced">0</b></div>
          <div class="note" id="play-note"></div>
        </div>
        <div class="sec"><div class="sec-title">悬停 / 上次操作</div><div id="inspect" class="inspect"></div></div>
      </div>

      <div class="panel" id="panel-edit" hidden>
        <div class="sec"><div class="sec-title">笔刷<small>右键有东西的格子=擦掉 / 右键空地=放下笔刷</small></div><div id="palette" class="palette"></div></div>
        <div class="sec"><div class="sec-title">关卡体检</div><div id="checkup" class="checkup"></div></div>
        <div class="sec"><div class="sec-title">快捷键</div><div class="keys"><div><kbd>S</kbd> 试玩</div><div><kbd>Ctrl+S</kbd> 保存并新建</div><div><kbd>Esc</kbd> 放下笔刷</div></div></div>
      </div>
    </aside>
  </main>
</div>

<div class="modal" id="modal" hidden><div class="modal-box">
  <div class="modal-head"><b id="modal-title"></b><button class="btn ghost" id="modal-close">关闭</button></div>
  <div class="modal-body" id="modal-body"></div></div></div>
<div class="toast" id="toast" hidden></div>

<pre id="probe-out" style="position:fixed;left:-9999px">RUNNING</pre>

<script src="../js/core.js"></script>
<script src="../js/rules.js"></script>
<script src="../js/fx.js"></script>
<script src="../js/sfx.js"></script>
<script src="../js/library.js"></script>
<script src="../js/render.js"></script>
<script src="../js/app.js"></script>
<script>
(function () {
  var out = [];
  var errs = [];
  window.onerror = function (m, s, l, c) { errs.push(m + ' @' + l + ':' + c); };
  window.addEventListener('unhandledrejection', function (e) { errs.push('promise: ' + e.reason); });
  function ok(c, m) { out.push((c ? 'PASS ' : 'FAIL ') + m); }
  function finish() {
    document.getElementById('probe-out').textContent =
      '<<<PROBE\n' + out.join('\n') + '\nERRORS: ' + (errs.length ? errs.join(' | ') : 'none') + '\nPROBE>>>';
  }
  function disp(id) {
    var el = document.getElementById(id);
    if (!el) return 'missing';
    return window.getComputedStyle(el).display;
  }
  function stats() {
    var c = document.getElementById('board');
    var d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
    var set = {}, bg = 0, n = 0;
    for (var i = 0; i < d.length; i += 4) {
      n++;
      var k = (d[i] >> 3) + ',' + (d[i + 1] >> 3) + ',' + (d[i + 2] >> 3);
      set[k] = 1;
      if (d[i] === 11 && d[i + 1] === 14 && d[i + 2] === 20) bg++;
    }
    return { colors: Object.keys(set).length, nonBg: n - bg, total: n };
  }
  function px(x, y) {
    var c = document.getElementById('board');
    var d = c.getContext('2d').getImageData(Math.round(x), Math.round(y), 1, 1).data;
    return 'rgb(' + d[0] + ',' + d[1] + ',' + d[2] + ')';
  }
  function center(cellX, cellY) {
    var v = window.MPApp.view;
    return { x: v.ox + (cellX + 0.5) * v.cell, y: v.oy + (cellY + 0.5) * v.cell };
  }
  function mouse(x, y, button, buttons, extra) {
    var cv = document.getElementById('board');
    var r = cv.getBoundingClientRect();
    var init = {
      clientX: r.left + x, clientY: r.top + y,
      button: button || 0, buttons: buttons === undefined ? 1 : buttons, bubbles: true,
    };
    if (extra) for (var k in extra) init[k] = extra[k];
    cv.dispatchEvent(new MouseEvent('mousedown', init));
  }
  function wheel(dy) {
    var cv = document.getElementById('board');
    cv.dispatchEvent(new WheelEvent('wheel', { deltaY: dy, bubbles: true, cancelable: true }));
  }
  function key(k, extra) {
    var init = { key: k, bubbles: true };
    if (extra) for (var kk in extra) init[kk] = extra[kk];
    window.dispatchEvent(new KeyboardEvent('keydown', init));
  }
  function step(n) { for (var i = 0; i < n; i++) window.MPApp.step(16 / 1000); }

  /* ---------------------------------------------------------------- 主流程 */
  function run() {
    var MP = window.MPCore, App = window.MPApp, FX = window.MPFx;
    out.push('PROBE-START');
    ok(!!App, 'MPApp 已初始化');

    /* 布局 */
    ok(document.getElementById('board').width > 0, 'canvas 位图已建立');
    ok(document.querySelectorAll('.pal-btn').length >= 46,
      '调色板按钮数 = ' + document.querySelectorAll('.pal-btn').length + '（含 8 种交换器）');
    ok(/^v\d+\.\d+\.\d+/.test(document.getElementById('brand-ver').textContent),
      '顶栏版本号 = ' + document.getElementById('brand-ver').textContent);

    /* 选关界面（需求 4） */
    ok(App.screen === 'select', '游玩页签默认停在选关界面');
    ok(disp('play-select') !== 'none', '选关界面可见');
    ok(disp('stage') === 'none', '选关时舞台隐藏');
    ok(disp('panel-play') !== 'none' && disp('panel-edit') === 'none', '游玩模式面板正确');
    ok(disp('tree-col') === 'none', '游玩时不显示关卡信息栏');

    App.startLevel('__sandbox__');
    step(2);
    ok(disp('play-select') === 'none' && disp('stage') !== 'none', '开始游戏后切到舞台');
    var wrap = document.getElementById('board-wrap').getBoundingClientRect();
    ok(wrap.width > 400 && wrap.height > 300, '舞台可见后棋盘容器有真实尺寸 ' + Math.round(wrap.width) + 'x' + Math.round(wrap.height));

    var s0 = stats();
    ok(s0.nonBg > 5000, '画布真的画了东西（非背景像素 ' + s0.nonBg + '）');
    ok(s0.colors > 25, '画面颜色数 = ' + s0.colors);
    var cDev = center(2, 2);
    ok(px(cDev.x, cDev.y) !== 'rgb(26,33,48)', '设备格里画了设备（' + px(cDev.x, cDev.y) + '）');

    /* 悬停推演 */
    App.hover = { x: 2, y: 2 };
    step(1);
    var s1 = stats();
    ok(s1.colors > s0.colors || s1.nonBg !== s0.nonBg, '悬停预演改变了画面');

    /* 动画逐帧 */
    App.hover = null;
    step(1);
    var shots = [];
    mouse(cDev.x, cDev.y, 0, 1);
    ok(FX.items.length > 0, '点击后产生动画（' + FX.items.length + ' 项）');
    for (var f = 0; f < 16; f++) { step(1); shots.push(JSON.stringify(stats())); }
    var uniq = {};
    shots.forEach(function (s) { uniq[s] = 1; });
    ok(Object.keys(uniq).length >= 4, '动画期间画面连续变化（' + Object.keys(uniq).length + ' 帧不同）');
    step(50);
    ok(FX.items.length === 0, '动画播完');

    /* 微任务（whenIdle 解锁 busy）需要先跑完，再测快捷键 */
    setTimeout(function () {
      ok(App.busy === false, '动画结束后输入解锁');
      var moves1 = App.moves;
      key(' ');
      ok(App.moves === Math.max(0, moves1 - 1), '空格 = 撤回（' + moves1 + ' → ' + App.moves + '）');
      key('r');
      ok(App.moves === 0, 'R = 重开');
      editorPhase();
    }, 0);
  }

  /* ---------------------------------------------------------------- 编辑器段 */
  function editorPhase() {
    var MP = window.MPCore, App = window.MPApp;
    App.setMode('edit');
    step(1);
    ok(disp('tree-col') !== 'none', '编辑器显示左侧关卡信息栏');
    ok(disp('panel-edit') !== 'none', '编辑面板可见');

    /* 需求 2：操作都搬到棋盘下面那条，左边栏管关卡，右栏只管画画 */
    ok(disp('edit-bar') !== 'none', '编辑器中间出现了操作条');
    var barBtns = document.getElementById('edit-bar').querySelectorAll('button').length;
    ok(barBtns >= 7, '操作条上有 ' + barBtns + ' 个按钮（试玩 / 保存并新建 / 撤销 / 清空 / 导出 / 导入 / JSON）');
    ok(!!document.getElementById('tree-col').querySelector('#edit-name'), '关卡属性挪到了左边栏');
    ok(!document.getElementById('side-col').querySelector('#edit-name'), '右栏不再挤着关卡信息');
    ok(!!document.getElementById('tree-col').querySelector('#edit-chapter'), '所属大关下拉也在左边栏');
    var bar = document.getElementById('edit-bar').getBoundingClientRect();
    var stageR = document.getElementById('stage').getBoundingClientRect();
    ok(Math.abs((bar.left + bar.width / 2) - (stageR.left + stageR.width / 2)) < 40, '操作条是居中的');

    var chId = window.MPLibrary.addChapter('探针大关');
    App.selChapter = chId;
    App.newLevel(chId);
    step(1);
    ok(App.editLevel && App.editLevel.chapter === chId, '新建关卡落在大关里');
    ok(document.getElementById('tree').children.length >= 2, '关卡信息栏渲染出 ' + document.getElementById('tree').children.length + ' 个大关分组');
    ok(document.getElementById('edit-chapter').options.length >= 2, '所属大关下拉有 ' + document.getElementById('edit-chapter').options.length + ' 项');

    /* 需求 1：墙彻底取消 —— 改尺寸不再铺外墙，调色板里也没有墙笔刷 */
    App.resizeLevel(11, 8);
    var MPx = window.MPCore;
    var anyWall = false;
    App.editLevel.cells.forEach(function (c) { if (c.t === MPx.WALL) anyWall = true; });
    ok(!anyWall, '改尺寸后不会自动生成墙');
    ok(MPx.at(App.editLevel, 0, 0).t === MPx.FLOOR && MPx.at(App.editLevel, 10, 7).t === MPx.FLOOR,
      '四个角就是普通格子，外沿就是边界');
    var wallBtns = 0;
    Array.prototype.forEach.call(document.querySelectorAll('.pal-btn .lbl'), function (el) {
      if (el.textContent.indexOf('墙') >= 0) wallBtns++;
    });
    ok(wallBtns === 0, '调色板里已经没有墙笔刷');

    /* 需求 1：最小尺寸不再是 3 格（墙没了就没有理由限制） */
    var tiny = window.MPLibrary.blank(1, 1, 'tiny');
    ok(tiny.w === 1 && tiny.h === 1, 'Lib.blank(1,1) 现在是合法的');
    App.resizeLevel(1, 2);
    ok(App.editLevel.w === 1 && App.editLevel.h === 2, '编辑器可以缩到 1×2');
    App.undoEditStroke();
    ok(App.editLevel.w === 11 && App.editLevel.h === 8, '撤销后尺寸和内容都回来了');

    /* 画点东西 */
    App.setBrush({ kind: 'device', type: 'rotate', s: 'cw' });
    App.paint(3, 3, false);
    App.setBrush({ kind: 'piece', piece: 'square' });
    App.paint(3, 2, false);
    App.setBrush({ kind: 'goal', goal: 'square' });
    App.paint(4, 3, false);
    ok(MPx.itemAt(App.editLevel, 3, 2).k === 'square', '编辑器放置正方形成功');
    ok(document.getElementById('level-title').textContent.indexOf('未保存') >= 0,
      '画了东西之后标题显示「未保存」：' + document.getElementById('level-title').textContent);

    /* 需求 6：右键点空格 = 取消目标（顺带把物品一起清掉） */
    App.setBrush({ kind: 'goal', goal: 'circle' });
    App.paint(9, 6, false);
    ok(MPx.at(App.editLevel, 9, 6).goal === 'circle', '画上一个圆形目标');
    mouse(center(9, 6).x, center(9, 6).y, 2, 2);
    ok(MPx.at(App.editLevel, 9, 6).goal === null && !MPx.itemAt(App.editLevel, 9, 6),
      '右键之后目标被取消');

    /* 需求 2：右键点空地 = 放下手里的笔刷（空手状态左键不画东西） */
    App.setBrush({ kind: 'device', type: 'push', s: 'R' });
    ok(App.brush.kind === 'device', '手里拿着一台设备');
    mouse(center(1, 1).x, center(1, 1).y, 2, 2);
    ok(App.brush.kind === 'none', '右键点空地 → 放下手中的设备（空手）');
    var snapshot = JSON.stringify(App.editLevel.cells);
    mouse(center(1, 1).x, center(1, 1).y, 0, 1);
    App.stroke = false;
    ok(JSON.stringify(App.editLevel.cells) === snapshot, '空手的时候左键点下去什么都不画');
    App.setBrush({ kind: 'piece', piece: 'square' });
    key('Escape');
    ok(App.brush.kind === 'none', 'Esc 也能放下笔刷');
    ok(App.brush.kind === 'none' && document.querySelectorAll('.pal-btn.is-on').length === 0,
      '空手时调色板上没有任何笔刷是高亮的');
    /* 空手也能右键擦：光标下这一格被擦干净 */
    App.setBrush({ kind: 'goal', goal: 'circle' });
    App.paint(5, 1, false);
    App.dropBrush(true);
    mouse(center(5, 1).x, center(5, 1).y, 2, 2);
    ok(MPx.at(App.editLevel, 5, 1).goal === null, '空手时右键仍然能擦掉格子里的东西');
    App.setBrush({ kind: 'device', type: 'push', s: 'R' });

    /* 需求 2：右键按住拖动连续擦 */
    App.setBrush({ kind: 'device', type: 'push', s: 'R' });
    App.paint(2, 5, false);
    App.paint(3, 5, false);
    App.paint(4, 5, false);
    App.snapshotEdit();
    App.stroke = true;
    App.paint(2, 5, true);
    var p2 = center(3, 5), p3 = center(4, 5);
    mouse(p2.x, p2.y, 2, 2);
    mouse(p3.x, p3.y, 2, 2);
    App.stroke = false;
    ok(!MPx.itemAt(App.editLevel, 2, 5) &&
      !MPx.itemAt(App.editLevel, 3, 5) &&
      !MPx.itemAt(App.editLevel, 4, 5), '按住右键拖动可以连续擦除');

    /* 需求 3：中键吸取 */
    App.setBrush({ kind: 'piece', piece: 'circle' });
    App.paint(6, 5, false);
    App.setBrush({ kind: 'goal', goal: 'circle' });
    var p4 = center(6, 5);
    mouse(p4.x, p4.y, 1, 4);
    ok(App.brush.kind === 'piece' && App.brush.piece === 'circle', '中键吸取到圆形');
    App.paint(6, 5, true);   /* 擦掉这个圆形，保证后面这一关是可通关的 */

    /* 需求：滚轮 —— 设备换状态，正方形/圆形/方形目标/圆形目标 四种循环 */
    App.setBrush({ kind: 'piece', piece: 'square' });
    wheel(120);
    ok(App.brush.kind === 'piece' && App.brush.piece === 'circle', '滚轮：正方形 → 圆形');
    wheel(120);
    ok(App.brush.kind === 'goal' && App.brush.goal === 'square', '滚轮：圆形 → 方形目标');
    wheel(120);
    ok(App.brush.kind === 'goal' && App.brush.goal === 'circle', '滚轮：方形目标 → 圆形目标');
    wheel(120);
    ok(App.brush.kind === 'piece' && App.brush.piece === 'square', '滚轮：圆形目标 → 绕回正方形');
    wheel(-120);
    ok(App.brush.kind === 'goal' && App.brush.goal === 'circle', '反向滚轮回去');
    App.setBrush({ kind: 'device', type: 'swap', s: 'ur_dr' });
    wheel(120);
    ok(App.brush.s === 'ul_dr', '滚轮：设备换状态（ur_dr → ul_dr，新的主对角交换器）');
    wheel(120);
    ok(App.brush.s === 'dl_ur', '滚轮：ur_dr → ul_dr → dl_ur（新的两种都能滚到）');

    /* 需求：调色板里能看到两种新交换器 */
    var diagBtns = 0;
    Array.prototype.forEach.call(document.querySelectorAll('.pal-btn .lbl'), function (el) {
      if (el.textContent.indexOf('主对角') >= 0 || el.textContent.indexOf('副对角') >= 0) diagBtns++;
    });
    ok(diagBtns === 2, '调色板里有「主对角 / 副对角」两个新交换器（找到 ' + diagBtns + ' 个）');

    /* 新交换器的图标：主对角交换器的两条线段应当沿「左上—右下」，不该出现在另一条对角线上 */
    App.setBrush({ kind: 'device', type: 'swap', s: 'ul_dr' });
    App.paint(2, 6, false);
    App.hover = null;
    step(3);
    var cD = center(2, 6), rr = window.MPApp.view.cell * 0.24;
    var onMain = px(cD.x - rr, cD.y - rr);
    var onAnti = px(cD.x + rr, cD.y - rr);
    ok(onMain !== onAnti, '主对角交换器只画在左上—右下方向（' + onMain + ' vs ' + onAnti + '）');
    App.setBrush({ kind: 'device', type: 'swap', s: 'dl_ur' });
    App.paint(2, 6, false);
    step(3);
    var a2 = px(cD.x - rr, cD.y - rr);
    var b2 = px(cD.x + rr, cD.y - rr);
    ok(a2 !== b2, '副对角交换器的图标方向不一样（' + a2 + ' vs ' + b2 + '）');
    App.paint(2, 6, true);

    /* 需求 6：覆盖绘制要有交叉淡出（落笔动画带着旧内容） */
    App.setBrush({ kind: 'device', type: 'push', s: 'R' });
    App.paint(3, 3, false);
    var cover = null;
    window.MPFx.items.forEach(function (f) {
      if (f.kind === 'place' && f.at.x === 3 && f.at.y === 3) cover = f;
    });
    ok(cover && cover.prev && cover.prev.type === 'rotate', '覆盖同一格时带上了旧设备（用于虚化淡出）');
    ok(cover && cover.item && cover.item.type === 'push', '同时带上了新设备');
    step(6);
    App.setBrush({ kind: 'device', type: 'rotate', s: 'cw' });
    App.paint(3, 3, false);   /* 画回旋转器：后面试玩要靠它通关 */
    ok(MPx.itemAt(App.editLevel, 3, 3).type === 'rotate', '再画回旋转器');

    /* 图标：设备没有矩形外壳（四角应当是地板色） */
    App.setBrush({ kind: 'device', type: 'push', s: 'R' });
    App.paint(7, 6, false);
    step(1);
    var cc = center(7, 6);
    var corner = px(cc.x - window.MPApp.view.cell * 0.44, cc.y - window.MPApp.view.cell * 0.44);
    ok(corner !== 'rgb(40,42,44)', '设备角落采样 = ' + corner);

    /* 保存 / JSON / 试玩 */
    App.saveLevel(false);
    ok(!!App.editLevel.id, '保存得到 id');
    ok(document.getElementById('level-title').textContent.indexOf('未保存') < 0, '保存后「未保存」标记消失');
    ok(window.localStorage.getItem('mp.library.v1') !== null, 'localStorage 写入成功');
    var round = window.MPLibrary.importText(window.MPLibrary.serialize(App.editLevel));
    ok(round.level && round.level.cells[MPx.idx(round.level, 3, 3)].item.type === 'rotate', 'JSON 往返保留旋转器');

    setTimeout(finalPhase, 0);
  }

  function finalPhase() {
    var MP = window.MPCore, App = window.MPApp;
    ok(App.busy === false, '上一段动画的 busy 已解锁');

    document.getElementById('btn-edit-play').click();
    ok(App.mode === 'play' && App.fromEdit, '从编辑器进入试玩');
    ok(disp('stage') !== 'none', '试玩时舞台可见');
    ok(disp('play-bar') !== 'none' && disp('edit-bar') === 'none', '试玩时只显示游玩操作条');

    /* 需求 2：B 一键返回编辑；S 一键试玩；Ctrl+S 保存并新建下一关 */
    var savedId = App.editLevel.id;
    key('b');
    ok(App.mode === 'edit' && App.fromEdit === false, 'B 键 = 从试玩返回编辑');
    ok(disp('edit-bar') !== 'none' && disp('play-bar') === 'none', '编辑操作条回来了');

    var w0 = App.editLevel.w, h0 = App.editLevel.h;
    var n0 = window.MPLibrary.count();
    key('s', { ctrlKey: true });
    ok(window.MPLibrary.count() === n0 + 1, 'Ctrl+S 保存 + 自动新建下一关（' + n0 + ' → ' + window.MPLibrary.count() + '）');
    ok(App.editLevel.w === w0 && App.editLevel.h === h0, '新关卡尺寸沿用 ' + w0 + '×' + h0);
    ok(/^\d+-\d+$/.test(App.editLevel.name), '新关卡自动命名 = ' + App.editLevel.name + '（大关号-关卡号）');
    ok(App.editLevel.id !== savedId, '编辑器已经切到新的一关');

    /* 回到刚才那一关，用 S 键试玩（后面靠它通关） */
    App.openLevelInEditor(savedId);
    key('s');
    ok(App.mode === 'play' && App.fromEdit === true, 'S 键 = 一键试玩');
    ok(disp('stage') !== 'none', 'S 试玩后停在舞台上');

    document.getElementById('btn-help').click();
    ok(disp('modal') !== 'none', '帮助弹窗真的显示');
    document.getElementById('modal-close').click();
    ok(disp('modal') === 'none', '关闭后弹窗不再挡住棋盘');

    var L = App.level, found = null;
    for (var y = 0; y < L.h && !found; y++) {
      for (var x = 0; x < L.w; x++) {
        if (MP.isDevice(L.cells[y * L.w + x].item)) { found = { x: x, y: y }; break; }
      }
    }
    ok(!!found, '试玩棋盘里找到设备 (' + (found && found.x) + ',' + (found && found.y) + ')');
    step(1);
    var c = center(found.x, found.y);
    mouse(c.x, c.y, 0, 1);
    step(60);
    ok(window.MPRules.isWin(App.level) === true, '旋转一次后通关');

    /* 返回选关 → 进度 ✓ */
    setTimeout(function () {
      ok(App.won === true, 'App.won = true');
      ok(disp('win-banner') !== 'none', '通关横幅显示');
      var cleared = window.MPLibrary.isCleared(App.level.id);
      ok(cleared === true, '通关进度已记录');
      key('Escape');
      step(1);
      ok(App.screen === 'select', 'Esc 返回选关');
      ok(disp('play-select') !== 'none', '选关界面重新出现');
      var cards = document.querySelectorAll('.level-card');
      ok(cards.length >= 1, '选关界面有 ' + cards.length + ' 张关卡卡片');
      ok(document.querySelectorAll('.level-card.is-cleared').length >= 1, '通关的关卡卡片有 ✓ 标记');

      /* 需求 3：卡片上的缩略小地图 */
      var thumbs = document.querySelectorAll('.level-card .lc-thumb');
      ok(thumbs.length === cards.length, '每张卡片都有缩略小地图（' + thumbs.length + ' / ' + cards.length + '）');
      ok(thumbs.length && thumbs[0].width > 0, '缩略图 canvas 真的画了（位图宽 ' + (thumbs[0] && thumbs[0].width) + '）');

      /* 需求 4：音效 */
      ok(!!window.MPSfx, 'MPSfx 已加载');
      ok(window.MPSfx.names.length >= 8, '音色表有 ' + window.MPSfx.names.length + ' 种');
      ok(disp('chk-sfx') !== 'none', '顶栏有音效开关');
      var sfxErr = null;
      try {
        window.MPSfx.names.forEach(function (n) { window.MPSfx.play(n); });
      } catch (e) { sfxErr = e; }
      ok(!sfxErr, '所有音色在真实浏览器里播放都不抛异常' + (sfxErr ? '：' + sfxErr.message : ''));
      ok(window.MPSfx.play('这个音色不存在') === false, '未知音色名安静地返回 false');
      var chkS = document.getElementById('chk-sfx');
      var wasOn = chkS.checked;
      chkS.checked = false;
      chkS.dispatchEvent(new Event('change', { bubbles: true }));
      ok(window.MPSfx.enabled === false, '关掉音效开关生效');
      chkS.checked = true;
      chkS.dispatchEvent(new Event('change', { bubbles: true }));
      ok(window.MPSfx.enabled === true, '重新打开音效开关生效');
      ok(wasOn === true, '音效默认是开的');

      finish();
    }, 30);
  }

  window.addEventListener('load', function () {
    setTimeout(function () {
      try { run(); }
      catch (e) { errs.push('throw: ' + (e && e.stack ? e.stack : e)); }
      finish();
    }, 120);
    setTimeout(function () {
      if (document.getElementById('probe-out').textContent === 'RUNNING') {
        out.push('WATCHDOG-TIMEOUT（流程未跑完）');
        finish();
      }
    }, 5000);
  });
})();
</script>
</body>
</html>
